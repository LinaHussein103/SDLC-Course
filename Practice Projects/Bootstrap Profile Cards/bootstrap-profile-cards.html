<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap Profile Cards</title>

  <!-- Bootstrap CSS (needs an internet connection) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Your own CSS goes AFTER Bootstrap so your rules win -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <h1 class="text-center my-4">Meet the Team</h1>

    <div class="row">

      <!-- Card 1 -->
      <div class="col-md-4 mb-4">
        <div class="card shadow">
          <div class="card-body text-center">
            <h5 class="card-title">Sam the Student</h5>
            <p class="card-text">Loves drawing, football, and building small websites.</p>
            <button class="btn btn-primary">Say hi</button>
          </div>
        </div>
      </div>

      <!-- Card 2 -->
      <div class="col-md-4 mb-4">
        <div class="card shadow">
          <div class="card-body text-center">
            <h5 class="card-title">Milo the Cat</h5>
            <p class="card-text">Sleeps all day and wakes up only for snacks.</p>
            <button class="btn btn-success">Say hi</button>
          </div>
        </div>
      </div>

      <!-- Card 3 -->
      <div class="col-md-4 mb-4">
        <div class="card shadow">
          <div class="card-body text-center">
            <h5 class="card-title">Pixel the Robot</h5>
            <p class="card-text">A friendly robot who knows every HTML tag by heart.</p>
            <button class="btn btn-danger">Say hi</button>
          </div>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
