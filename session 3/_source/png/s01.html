<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UI/UX Design — Codeflow PSUT</title>
<style>
@page { size: 1280px 720px; margin: 0; }
:root{
  --ink:#0E1628; --ink2:#334155; --muted:#5B6678; --line:#DCE1EA; --bg:#F5F7FB; --card:#FFFFFF;
  --navy:#0A1022; --navy2:#121A33; --indigo:#4F46E5; --cyan:#0891B2; --cyanL:#22D3EE; --amber:#F59E0B;
  --good:#047857; --goodL:#D1FAE5; --bad:#BE123C; --badL:#FFE4E6;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,sans-serif;color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.slide{width:1280px;height:720px;position:relative;overflow:hidden;background:var(--bg);break-after:page;page-break-after:always}
.slide:last-child{break-after:auto}
.pad{position:absolute;inset:0;padding:56px 72px 64px}
h1,h2,h3,.disp{font-family:Bahnschrift,"Segoe UI",sans-serif;margin:0;font-weight:600;letter-spacing:-.2px}
h2{font-size:42px;line-height:1.08;color:var(--ink)}
h3{font-size:21px;line-height:1.2}
p{margin:0}
.kicker{font-family:Bahnschrift,sans-serif;font-size:14px;letter-spacing:2.4px;text-transform:uppercase;color:var(--indigo);font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.kicker::before{content:"";width:26px;height:3px;background:linear-gradient(90deg,var(--indigo),var(--cyanL));border-radius:2px}
.lead{font-size:20px;line-height:1.45;color:var(--ink2);margin-top:14px;max-width:900px}
.foot{position:absolute;left:72px;right:72px;bottom:22px;display:flex;justify-content:space-between;font-size:12px;color:#8A94A6;letter-spacing:.3px}
.foot b{color:#5B6678;font-weight:600}
.dark .foot{color:#6B7699}.dark .foot b{color:#9AA5C4}
.dark{background:radial-gradient(1200px 700px at 85% 10%,#1C2A5C 0%,transparent 60%),radial-gradient(900px 600px at 0% 100%,#0E3A4A 0%,transparent 55%),var(--navy);color:#fff}
.grid-bg::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:40px 40px;pointer-events:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 6px 18px rgba(15,23,42,.05)}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;font-size:14px;font-weight:600}
.row{display:flex;gap:20px}
.small{font-size:14px;color:var(--muted);line-height:1.45}
.num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--indigo);color:#fff;font:600 14px Bahnschrift,sans-serif;flex:none}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:6px;background:#EEF2FF;color:#3730A3}
/* question slides */
.q .pad{display:flex;flex-direction:column;justify-content:center}
.q .qlabel{font-family:Bahnschrift,sans-serif;font-size:16px;letter-spacing:3px;color:var(--amber);text-transform:uppercase;font-weight:600;display:flex;align-items:center;gap:12px}
.q .qmark{position:absolute;right:40px;top:-60px;font:700 560px/1 Bahnschrift,sans-serif;color:rgba(255,255,255,.04)}
.q h1{font-size:68px;line-height:1.08;margin-top:22px;max-width:1000px;font-weight:600}
.q .hint{margin-top:34px;display:flex;gap:12px}
.q .hint span{border:1px solid rgba(255,255,255,.18);color:#C9D2EA;padding:9px 16px;border-radius:999px;font-size:15px}
/* phones */
.phone{width:236px;height:480px;border-radius:36px;background:#0B0F1A;padding:9px;box-shadow:0 20px 40px rgba(15,23,42,.18);position:relative;flex:none}
.phone .scr{width:100%;height:100%;border-radius:28px;overflow:hidden;background:#fff;position:relative;font-size:11px}
.phone .notch{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:84px;height:18px;background:#0B0F1A;border-radius:0 0 12px 12px;z-index:5}
.sbar{height:28px;display:flex;justify-content:space-between;align-items:center;padding:0 18px;font-size:10px;font-weight:600}
.arrow{color:var(--indigo);font:600 28px Bahnschrift}
.callout{position:absolute;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--amber);color:#111;font:700 13px Bahnschrift;box-shadow:0 0 0 3px #fff;z-index:6}
html,body{width:1280px;height:720px;overflow:hidden}</style>
</head>
<body><section class="slide dark grid-bg">
  <svg style="position:absolute;right:-40px;top:70px;opacity:.9" width="560" height="560" viewBox="0 0 560 560">
    <defs><linearGradient id="g1" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#4F46E5"/><stop offset="1" stop-color="#22D3EE"/></linearGradient></defs>
    <!-- stylised wireframe → UI motif -->
    <rect x="250" y="40" width="210" height="420" rx="34" fill="none" stroke="url(#g1)" stroke-width="3"/>
    <rect x="272" y="86" width="166" height="26" rx="13" fill="none" stroke="#7DD3FC" stroke-opacity=".6" stroke-width="2"/>
    <rect x="272" y="130" width="76" height="96" rx="10" fill="#4F46E5" fill-opacity=".35"/>
    <rect x="362" y="130" width="76" height="96" rx="10" fill="#22D3EE" fill-opacity=".25"/>
    <rect x="272" y="244" width="166" height="12" rx="6" fill="#fff" fill-opacity=".25"/>
    <rect x="272" y="266" width="120" height="12" rx="6" fill="#fff" fill-opacity=".15"/>
    <rect x="272" y="300" width="166" height="54" rx="12" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="2"/>
    <rect x="272" y="372" width="166" height="40" rx="20" fill="url(#g1)"/>
    <rect x="40" y="120" width="170" height="330" rx="24" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="2" stroke-dasharray="7 7"/>
    <line x1="62" y1="160" x2="188" y2="160" stroke="#fff" stroke-opacity=".25" stroke-width="2"/>
    <rect x="62" y="180" width="56" height="70" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="2"/>
    <line x1="62" y1="180" x2="118" y2="250" stroke="#fff" stroke-opacity=".2" stroke-width="1.5"/><line x1="118" y1="180" x2="62" y2="250" stroke="#fff" stroke-opacity=".2" stroke-width="1.5"/>
    <rect x="132" y="180" width="56" height="70" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="2"/>
    <rect x="62" y="380" width="126" height="34" rx="6" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="2"/>
    <path d="M212 280 C 230 280, 232 280, 246 280" stroke="#22D3EE" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#22D3EE"/></marker></defs>
  </svg>
  <div class="pad" style="display:flex;flex-direction:column;justify-content:center">
    <div class="disp" style="font-size:17px;letter-spacing:3px;color:#7DD3FC;text-transform:uppercase">Codeflow PSUT &nbsp;·&nbsp; Session: Design Phase</div>
    <h1 style="font-size:66px;line-height:1.04;margin-top:22px;max-width:720px">UI/UX Design:<br><span style="color:#A5B4FC">From Requirements to</span> <span style="color:#67E8F9">User Experience</span></h1>
    <p style="font-size:24px;color:#C9D2EA;margin-top:24px">Industry Practices Using the SDLC</p>
    <div style="margin-top:46px;display:flex;gap:14px">
      <span class="chip" style="background:rgba(255,255,255,.08);color:#E2E8F0;border:1px solid rgba(255,255,255,.15)">Codeflow PSUT</span>
      <span class="chip" style="background:rgba(255,255,255,.08);color:#E2E8F0;border:1px solid rgba(255,255,255,.15)">November 4, 2026</span>
    </div>
  </div>
  <div class="foot"><span><b>Princess Sumaya University for Technology</b></span><span>01</span></div>
</section></body></html>
